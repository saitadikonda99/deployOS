name: Bug report
description: Report a problem with DeployOS
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](https://github.com/saitadikonda99/deployOS/issues)
        first to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of DeployOS is affected?
      options:
        - apps/dashboard
        - apps/control-plane
        - crates/agent
        - crates/protocol
        - crates/common
        - tooling / CI
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DeployOS version / commit
      placeholder: e.g. commit sha or `git describe`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node.js version:
        pnpm version:
        Rust version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
