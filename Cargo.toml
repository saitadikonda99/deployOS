[workspace]
resolver = "2"
members = ["crates/agent", "crates/common", "crates/protocol"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/saitadikonda99/deployOS"
publish = false

[workspace.dependencies]
deployos-common = { path = "crates/common" }
deployos-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
