// Command and CommandResult: the messages the Command Bus (see
// docs/command-bus.md) sends over ConnectionService's existing stream
// (see connection.proto's ConnectionEnvelope) to route a request to an
// agent and correlate its response.
//
// There is deliberately no CommandService/RPC here. A standalone unary
// RPC would have to be initiated by whichever side is the gRPC client -
// but the agent is always the client (it dials out; the control plane
// never dials in, since agents are commonly behind NAT). Command
// delivery has to ride the connection the agent already opened, which
// is exactly what ConnectionEnvelope's oneof is for.
syntax = "proto3";

package deployos.v1;

import "deployos/v1/common.proto";

option go_package = "github.com/saitadikonda99/deployOS/gen/go/deployos/v1;deployosv1";

// Command is a single instruction for an agent to carry out. kind is a
// free-form string rather than an enum because the set of command
// kinds isn't defined yet and will grow as features (deployments,
// restarts, upgrades) land - an enum would need a breaking change or
// awkward "UNSPECIFIED" values for each one added later.
message Command {
  string id = 1;
  string kind = 2;
  Metadata arguments = 3;

  reserved 4 to 10;
}

// CommandResult reports how an agent's execution of a Command went.
message CommandResult {
  string command_id = 1;
  bool success = 2;
  // message is a human-readable outcome description, populated on
  // both success and failure.
  string message = 3;
  Metadata details = 4;

  reserved 5 to 10;
}
